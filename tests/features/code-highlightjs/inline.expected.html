<h1 id="toc-a-heading-with-lenx--2-and-a_b">A heading with <code>len(x) % 2</code> and <code>a_b</code></h1>
<p>Specials <code>\section{x} #1 &amp; $5 ~ ^ _ % | &lt; &gt;</code>, quotes <code>'q' "d"</code> and <code>`b`</code>,
  no ligatures in <code>a--b ,,c &lt;&lt;d&gt;&gt; !x</code>, two spaces kept in <code>a  b</code>, a note<sup><a id="footnote-ref-1" href="#footnote-1" data-footnote-ref="" aria-describedby="footnote-label">1</a></sup>,

</p>
