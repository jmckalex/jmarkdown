<p>A markdown image of an SVG with nothing beside it becomes a link in LaTeX:
  <img src="figs/drawing.svg" alt="A vector drawing">
</p>
<p>So does a remote one: <img src="https://example.com/picture.png" alt="A remote picture"></p>
<p>An ordinary image is still included: <img src="figs/plain.png" alt="A plain picture"></p>
<p>A video whose poster is an SVG falls back to its caption:</p>
<video src="tiny.mp4" controls="" poster="still.svg" aria-label="A short clip" style="width: 30%; display: block"><a href="tiny.mp4">A short clip</a></video>
