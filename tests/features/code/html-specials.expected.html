<h1 id="toc-code-with-bxb-in-a-heading">Code with <code>&lt;b&gt;x&lt;/b&gt;</code> in a heading</h1>
<p>HTML specials in code are shown, never parsed: <code>&lt;/&gt;</code>, <code>&lt;b&gt;x&lt;/b&gt;</code>, <code>a &amp;&amp; b</code>,
  <code>x &lt; y</code>, <code>"quoted"</code>, and <code>&lt;img src=x onerror=alert(1)&gt;</code> stays text.
</p>
